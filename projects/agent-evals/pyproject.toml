[project]
name = "agent-evals"
version = "0.1.0"
description = "Independent, evidence-based Agent evaluation runner"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "PyYAML>=6,<7"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "project-index"
url = "http://pypi.qima-inc.com/youzan/dev/+simple/"
default = true
