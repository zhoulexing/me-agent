[project]
name = "cc-agent"
version = "0.1.0"
description = "Python cc-agent runtime built on claude_agent_sdk."
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.110",
    "fastapi>=0.121.0",
    "lark-oapi>=1.7.0",
    "pydantic-settings>=2.0.0",
    "uvicorn[standard]>=0.38.0",
]

[project.scripts]
cc-agent = "app.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.14.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
